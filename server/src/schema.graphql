enum SortDirection {
  ASC
  DESC
}

enum BoardRole {
  OWNER
  ADMIN
  MEMBER
}

enum InvitationStatus {
  PENDING
  ACCEPTED
  DECLINED
  REVOKED
  EXPIRED
}

enum TaskEventType {
  CREATED
  UPDATED
  DELETED
}

enum BoardEventType {
  BOARD_UPDATED
  LIST_CREATED
  LIST_UPDATED
  LIST_ARCHIVED
  CARD_CREATED
  CARD_UPDATED
  CARD_MOVED
  CARD_ARCHIVED
  CARD_DELETED
  LABEL_UPDATED
  CHECKLIST_UPDATED
  COMMENT_CREATED
}

input TaskFilterInput {
  search: String
}

input TaskSortInput {
  field: String!
  direction: SortDirection!
}

input CreateTaskInput {
  boardId: ID
  listId: ID
  title: String!
  description: String
  priority: Int
  assignees: [String!]
  position: Float
  dueDate: String
  coverColor: String
  clientMutationId: String
}

input UpdateTaskInput {
  listId: ID
  title: String
  description: String
  priority: Int
  assignees: [String!]
  position: Float
  dueDate: String
  coverColor: String
  archived: Boolean
  clientMutationId: String
}

input CreateBoardInput {
  title: String!
  description: String
  background: String
  logoImageData: String
}

input UpdateBoardInput {
  title: String
  description: String
  background: String
}

input UpdateMyProfileInput {
  displayName: String!
  pictureUrl: String
}

input CreateListInput {
  boardId: ID!
  title: String!
  position: Float
}

input UpdateListInput {
  title: String
  position: Float
  archived: Boolean
  clientMutationId: String
}

input MoveTaskInput {
  boardId: ID!
  taskId: ID!
  toListId: ID!
  position: Float!
  expectedVersion: Int
  clientMutationId: String
}

input InviteMemberInput {
  boardId: ID!
  email: String!
  role: BoardRole
  expiresInDays: Int
}

type Task {
  id: ID!
  boardId: ID!
  listId: ID!
  title: String!
  description: String
  priority: Int!
  assignees: [String!]!
  position: Float!
  dueDate: String
  coverColor: String
  archived: Boolean!
  version: Int!
  updatedAt: String!
}

type Board {
  id: ID!
  title: String!
  description: String
  background: String!
  logoUrl: String
  createdByAuth0Sub: ID!
  version: Int!
  createdAt: String!
  updatedAt: String!
}

type TaskList {
  id: ID!
  boardId: ID!
  title: String!
  position: Float!
  archived: Boolean!
  version: Int!
  createdAt: String!
  updatedAt: String!
}

type Label {
  id: ID!
  boardId: ID!
  name: String!
  color: String!
}

type ChecklistItem {
  id: ID!
  taskId: ID!
  text: String!
  checked: Boolean!
  position: Float!
}

type TaskComment {
  id: ID!
  taskId: ID!
  body: String!
  author: String!
  createdAt: String!
}

type ActivityItem {
  id: ID!
  taskId: ID
  type: String!
  message: String!
  actor: String!
  createdAt: String!
}

type UserProfile {
  auth0Sub: ID!
  displayName: String!
  email: String
  pictureUrl: String
  isOnboarded: Boolean!
  lastSeenAt: String
  createdAt: String!
  updatedAt: String!
}

type BoardMember {
  boardId: ID!
  auth0Sub: ID!
  role: BoardRole!
  displayName: String
  email: String
  pictureUrl: String
  invitedBy: String
  createdAt: String!
}

type BoardInvitation {
  id: ID!
  boardId: ID!
  boardTitle: String!
  boardBackground: String!
  email: String!
  role: BoardRole!
  status: InvitationStatus!
  invitedBy: String!
  acceptedBy: String
  expiresAt: String!
  createdAt: String!
  updatedAt: String!
}

type BoardCard {
  id: ID!
  boardId: ID!
  listId: ID!
  title: String!
  description: String
  priority: Int!
  assignees: [String!]!
  position: Float!
  dueDate: String
  coverColor: String
  archived: Boolean!
  version: Int!
  updatedAt: String!
  labels: [Label!]!
  checklist: [ChecklistItem!]!
  comments: [TaskComment!]!
}

type BoardList {
  id: ID!
  boardId: ID!
  title: String!
  position: Float!
  archived: Boolean!
  version: Int!
  createdAt: String!
  updatedAt: String!
  cards: [BoardCard!]!
}

type BoardView {
  board: Board!
  lists: [BoardList!]!
  labels: [Label!]!
  activity: [ActivityItem!]!
}

type PageInfo {
  page: Int!
  pageSize: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

type TaskConnection {
  nodes: [Task!]!
  totalCount: Int!
  pageInfo: PageInfo!
}

type TaskEvent {
  type: TaskEventType!
  task: Task!
}

type BoardEvent {
  type: BoardEventType!
  boardId: ID!
  clientMutationId: String
  actorId: String
  actorName: String
  task: Task
  list: TaskList
  label: Label
  comment: TaskComment
  checklistItem: ChecklistItem
  activity: ActivityItem
}

type Query {
  me: UserProfile
  projectUsers(boardId: ID!): [UserProfile!]!
  boardMembers(boardId: ID!): [BoardMember!]!
  boardInvitations(boardId: ID!): [BoardInvitation!]!
  myInvitations: [BoardInvitation!]!
  boards: [Board!]!
  board(id: ID!): Board
  defaultBoard: Board
  boardView(boardId: ID!): BoardView
  tasks(page: Int! = 1, pageSize: Int! = 10, filter: TaskFilterInput, sort: [TaskSortInput!]): TaskConnection!
  task(id: ID!): Task
  health: String!
}

type Mutation {
  updateMyProfile(input: UpdateMyProfileInput!): UserProfile!
  inviteMember(input: InviteMemberInput!): BoardInvitation!
  acceptInvitation(id: ID!): BoardInvitation!
  declineInvitation(id: ID!): BoardInvitation!
  createBoard(input: CreateBoardInput!): Board!
  updateBoard(id: ID!, input: UpdateBoardInput!, expectedVersion: Int): BoardMutationResult!
  createList(input: CreateListInput!): TaskList!
  updateList(id: ID!, input: UpdateListInput!, expectedVersion: Int): ListMutationResult!
  createTask(input: CreateTaskInput!): Task!
  updateTask(id: ID!, input: UpdateTaskInput!, expectedVersion: Int): TaskUpdateResult!
  moveTask(input: MoveTaskInput!): TaskUpdateResult!
  deleteTask(id: ID!, expectedVersion: Int): TaskDeleteResult!
  createLabel(boardId: ID!, name: String, color: String!): Label!
  setTaskLabels(taskId: ID!, labelIds: [ID!]!): Task
  createChecklistItem(taskId: ID!, text: String!, clientMutationId: String): ChecklistItem!
  updateChecklistItem(id: ID!, text: String, checked: Boolean): ChecklistItem
  addComment(taskId: ID!, body: String!): TaskComment!
}

type BoardMutationResult {
  success: Boolean!
  conflict: Boolean!
  board: Board
}

type ListMutationResult {
  success: Boolean!
  conflict: Boolean!
  list: TaskList
}

type TaskUpdateResult {
  success: Boolean!
  conflict: Boolean!
  task: Task
}

type TaskDeleteResult {
  success: Boolean!
  conflict: Boolean!
  task: Task
}

type Subscription {
  taskChanged: TaskEvent!
  boardChanged(boardId: ID!): BoardEvent!
}
