<div class="app-shell">
  <nav class="app-bar">
    <div class="bar-start">
      <a class="brand" routerLink="/home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <rect x="3" y="4" width="5" height="16" rx="1.4" />
            <rect x="10" y="4" width="5" height="11" rx="1.4" />
            <rect x="17" y="4" width="5" height="14" rx="1.4" />
          </svg>
        </span>
        <span class="brand-text">Project Board</span>
      </a>
    </div>
    <div class="bar-end">
      <button type="button" class="bar-button ghost" (click)="theme.toggle()">
        {{ theme.theme() === 'dark' ? 'Switch to light' : 'Switch to dark' }}
      </button>
      @if ((auth.user$ | async)) {
        <div class="profile-menu" #profileMenuRoot>
          <button
            type="button"
            class="profile-trigger"
            [attr.aria-expanded]="profileMenuOpen()"
            aria-haspopup="menu"
            (click)="toggleProfileMenu()">
            <img class="profile-avatar" [src]="profileAvatar()" [alt]="profileLabel() || 'User'" />
            <span class="profile-name">{{ profileLabel() || 'Account' }}</span>
          </button>
          @if (profileMenuOpen()) {
            <div class="profile-dropdown" role="menu">
              <a routerLink="/profile" role="menuitem" (click)="closeProfileMenu()">Profile</a>
              <button type="button" role="menuitem" (click)="logout()">Logout</button>
            </div>
          }
        </div>
      }
    </div>
  </nav>
  <main class="app-main">
    <router-outlet />
  </main>
  <app-toast-container />
</div>
