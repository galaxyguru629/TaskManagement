<section class="board-page" [style.background]="facade.board()?.background || 'var(--board-bg)'">
  <app-board-header
    [board]="facade.board()"
    [loading]="facade.loading()"
    [members]="facade.members()"
    [inviteContacts]="facade.inviteContacts()"
    [invitations]="facade.invitations()"
    [canInvite]="facade.canInvite()"
    [filterActive]="facade.filterActiveCount()"
    (filterToggle)="facade.toggleFilterPanel()"
    (inviteMember)="facade.inviteMember($event.email, $event.role)"
  />

  <app-board-canvas
    [lists]="facade.filteredLists()"
    [members]="facade.members()"
    [loading]="facade.loading()"
    [conflicts]="facade.conflicts()"
    (createList)="facade.createList($event)"
    (createCard)="facade.createCard($event.list, $event.title)"
    (moveCard)="facade.moveCard($event)"
    (moveList)="facade.reorderList($event)"
    (openCard)="facade.selectCard($event.id)"
    (archiveCard)="facade.archiveCard($event)"
  />

  <app-card-detail-modal
    [card]="facade.selectedCard()"
    [boardMembers]="facade.members()"
    [labels]="facade.view()?.labels ?? []"
    [activity]="facade.view()?.activity ?? []"
    [conflicts]="facade.conflicts()"
    [checklistPending]="facade.checklistPending()"
    [commentPending]="facade.commentPending()"
    (close)="facade.selectCard(null)"
    (saveCard)="facade.updateCard($event.card, $event.input)"
    (archiveCard)="facade.archiveCard($event)"
    (addChecklistItem)="facade.addChecklistItem($event.card, $event.text)"
    (toggleChecklistItem)="facade.selectedCard() && facade.updateChecklistItem(facade.selectedCard()!, $event.id, $event.checked)"
    (renameChecklistItem)="facade.selectedCard() && facade.renameChecklistItem(facade.selectedCard()!, $event.id, $event.text)"
    (deleteChecklistItem)="facade.selectedCard() && facade.deleteChecklistItem(facade.selectedCard()!, $event)"
    (addComment)="facade.addComment($event.card, $event.body)"
    (dismissConflict)="facade.dismissConflict($event)"
  />
</section>

@if (facade.filterOpen()) {
  <div class="filter-overlay" (click)="facade.toggleFilterPanel()"></div>
  <aside class="filter-panel-slide">
    <app-board-filter
      [search]="facade.filterSearch()"
      [assigneeIds]="facade.filterAssigneeIds()"
      [labelIds]="facade.filterLabelIds()"
      [dueDateOptions]="facade.filterDueDateOptions()"
      [priorities]="facade.filterPriorities()"
      [members]="facade.members()"
      [labels]="facade.view()?.labels ?? []"
      [resultCount]="facade.filteredCardCount()"
      (searchChange)="facade.setFilterSearch($event)"
      (assigneeToggle)="facade.toggleFilterAssignee($event)"
      (labelToggle)="facade.toggleFilterLabel($event)"
      (dueDateToggle)="facade.toggleFilterDueDate($event)"
      (priorityToggle)="facade.toggleFilterPriority($event)"
      (clearFilters)="facade.clearFilters()"
      (closePanel)="facade.toggleFilterPanel()"
    />
  </aside>
}
