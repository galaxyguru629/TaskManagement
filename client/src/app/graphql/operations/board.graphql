fragment BoardFields on Board {
  id
  title
  description
  background
  logoUrl
  createdByAuth0Sub
  version
  createdAt
  updatedAt
}

fragment LabelFields on Label {
  id
  boardId
  name
  color
}

fragment BoardMemberFields on BoardMember {
  boardId
  auth0Sub
  role
  displayName
  email
  pictureUrl
  invitedBy
  createdAt
}

fragment BoardInvitationFields on BoardInvitation {
  id
  boardId
  boardTitle
  boardBackground
  email
  role
  status
  invitedBy
  acceptedBy
  expiresAt
  createdAt
  updatedAt
}

fragment InviteUserFields on UserProfile {
  auth0Sub
  displayName
  email
  pictureUrl
}

fragment ChecklistItemFields on ChecklistItem {
  id
  taskId
  text
  checked
  position
}

fragment CommentFields on TaskComment {
  id
  taskId
  body
  author
  createdAt
}

fragment ActivityFields on ActivityItem {
  id
  taskId
  type
  message
  actor
  createdAt
}

fragment CardFields on BoardCard {
  id
  boardId
  listId
  title
  description
  priority
  assignees
  position
  dueDate
  coverColor
  archived
  version
  updatedAt
  labels {
    ...LabelFields
  }
  checklist {
    ...ChecklistItemFields
  }
  comments {
    ...CommentFields
  }
}

fragment TaskFields on Task {
  id
  boardId
  listId
  title
  description
  priority
  assignees
  position
  dueDate
  coverColor
  archived
  version
  updatedAt
}

fragment ListFields on BoardList {
  id
  boardId
  title
  position
  archived
  version
  createdAt
  updatedAt
  cards {
    ...CardFields
  }
}

query DefaultBoard {
  defaultBoard {
    ...BoardFields
  }
}

query Boards {
  boards {
    ...BoardFields
  }
}

query BoardMembers($boardId: ID!) {
  boardMembers(boardId: $boardId) {
    ...BoardMemberFields
  }
}

query BoardInvitations($boardId: ID!) {
  boardInvitations(boardId: $boardId) {
    ...BoardInvitationFields
  }
}

query ProjectUsers($boardId: ID!) {
  projectUsers(boardId: $boardId) {
    ...InviteUserFields
  }
}

query MyInvitations {
  myInvitations {
    ...BoardInvitationFields
  }
}

query BoardView($boardId: ID!) {
  boardView(boardId: $boardId) {
    board {
      ...BoardFields
    }
    lists {
      ...ListFields
    }
    labels {
      ...LabelFields
    }
    activity {
      ...ActivityFields
    }
  }
}

mutation CreateList($input: CreateListInput!) {
  createList(input: $input) {
    id
    boardId
    title
    position
    archived
    version
    createdAt
    updatedAt
  }
}

mutation CreateBoard($input: CreateBoardInput!) {
  createBoard(input: $input) {
    ...BoardFields
  }
}

mutation InviteMember($input: InviteMemberInput!) {
  inviteMember(input: $input) {
    ...BoardInvitationFields
  }
}

mutation AcceptInvitation($id: ID!) {
  acceptInvitation(id: $id) {
    ...BoardInvitationFields
  }
}

mutation DeclineInvitation($id: ID!) {
  declineInvitation(id: $id) {
    ...BoardInvitationFields
  }
}

mutation UpdateList($id: ID!, $input: UpdateListInput!, $expectedVersion: Int) {
  updateList(id: $id, input: $input, expectedVersion: $expectedVersion) {
    success
    conflict
    list {
      id
      boardId
      title
      position
      archived
      version
      createdAt
      updatedAt
    }
  }
}

mutation CreateTask($input: CreateTaskInput!) {
  createTask(input: $input) {
    ...TaskFields
  }
}

mutation UpdateTask($id: ID!, $input: UpdateTaskInput!, $expectedVersion: Int) {
  updateTask(id: $id, input: $input, expectedVersion: $expectedVersion) {
    success
    conflict
    task {
      ...TaskFields
    }
  }
}

mutation MoveTask($input: MoveTaskInput!) {
  moveTask(input: $input) {
    success
    conflict
    task {
      ...TaskFields
    }
  }
}

mutation DeleteTask($id: ID!, $expectedVersion: Int) {
  deleteTask(id: $id, expectedVersion: $expectedVersion) {
    success
    conflict
    task {
      ...TaskFields
    }
  }
}

mutation CreateLabel($boardId: ID!, $name: String, $color: String!) {
  createLabel(boardId: $boardId, name: $name, color: $color) {
    ...LabelFields
  }
}

mutation SetTaskLabels($taskId: ID!, $labelIds: [ID!]!) {
  setTaskLabels(taskId: $taskId, labelIds: $labelIds) {
    ...TaskFields
  }
}

mutation CreateChecklistItem($taskId: ID!, $text: String!, $clientMutationId: String) {
  createChecklistItem(taskId: $taskId, text: $text, clientMutationId: $clientMutationId) {
    ...ChecklistItemFields
  }
}

mutation UpdateChecklistItem($id: ID!, $text: String, $checked: Boolean) {
  updateChecklistItem(id: $id, text: $text, checked: $checked) {
    ...ChecklistItemFields
  }
}

mutation AddComment($taskId: ID!, $body: String!) {
  addComment(taskId: $taskId, body: $body) {
    ...CommentFields
  }
}

subscription BoardChanged($boardId: ID!) {
  boardChanged(boardId: $boardId) {
    type
    boardId
    clientMutationId
    actorId
    actorName
    task {
      ...TaskFields
    }
    list {
      id
      boardId
      title
      position
      archived
      version
      createdAt
      updatedAt
    }
    label {
      ...LabelFields
    }
    comment {
      ...CommentFields
    }
    checklistItem {
      ...ChecklistItemFields
    }
    activity {
      ...ActivityFields
    }
  }
}
